<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário Escolar</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f4f7;
        }

        header {
            background: linear-gradient(90deg, #0047AB, #32CD32);
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topo h2 {
            color: #0047AB;
        }

        .botao {
            background: #0057b8;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        .evento {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        button {
            margin-top: 12px;
            margin-right: 5px;
            padding: 7px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>📅 Calendário Escolar</h1>
</header>

<main>

   <div class="topo">

    <h2>Eventos cadastrados</h2>

    <div>
        <a href="admin.html" class="botao">
            ← Voltar ao painel
        </a>

        <a href="calendario.html" class="botao">
            + Novo evento
        </a>
    </div>

</div>

    <div id="listaCalendario"></div>

</main>

<script type="module">

    import { db, auth } from "./firebase-config.js";

    import {
        collection,
        getDocs,
        deleteDoc,
        doc,
        query,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    async function carregarCalendario() {

        const lista =
            document.getElementById("listaCalendario");

        lista.innerHTML = "<p>Carregando eventos...</p>";

        try {

            const consulta = query(
                collection(db, "calendario"),
                orderBy("data", "asc")
            );

            const resultado = await getDocs(consulta);

            lista.innerHTML = "";

            if (resultado.empty) {
                lista.innerHTML =
                    "<p>Nenhum evento cadastrado.</p>";
                return;
            }

            resultado.forEach((documento) => {

                const evento = documento.data();

                const dataFormatada =
                    evento.data.split("-").reverse().join("/");
const dataFimFormatada =
    evento.dataFim
        ? evento.dataFim.split("-").reverse().join("/")
        : "";
                const bloco =
                    document.createElement("div");

                bloco.className = "evento";

                bloco.innerHTML = `
                    <h3>
    📅 ${dataFormatada}
    ${dataFimFormatada ? " a " + dataFimFormatada : ""}
    - ${evento.titulo || ""}
</h3>

                    ${evento.descricao ? `
                        <p style="margin-top:10px;">
                            ${evento.descricao}
                        </p>
                    ` : ""}

                    <button
                        onclick="editarEvento('${documento.id}')">
                        ✏️ Editar
                    </button>

                    <button
                        onclick="excluirEvento('${documento.id}')">
                        🗑️ Excluir
                    </button>
                `;

                lista.appendChild(bloco);

            });

        } catch (erro) {

            console.error(
                "Erro ao carregar calendário:",
                erro
            );

            lista.innerHTML =
                "<p>Não foi possível carregar os eventos.</p>";
        }
    }


    function editarEvento(id) {

        window.location.href =
            "calendario.html?editar=" + id;

    }


    async function excluirEvento(id) {

        const confirmar =
            confirm("Deseja realmente excluir este evento?");

        if (!confirmar) {
            return;
        }

        try {

            await deleteDoc(
                doc(db, "calendario", id)
            );

            alert("Evento excluído com sucesso!");

            carregarCalendario();

        } catch (erro) {

            console.error(
                "Erro ao excluir evento:",
                erro
            );

            alert(
                "Não foi possível excluir o evento."
            );
        }
    }


    window.editarEvento = editarEvento;
    window.excluirEvento = excluirEvento;


    onAuthStateChanged(auth, function(usuario) {

        if (!usuario) {

            window.location.href = "login.html";

            return;
        }

        carregarCalendario();

    });

</script>

</body>
</html>
